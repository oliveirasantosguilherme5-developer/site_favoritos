<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos | Guilherme</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <header class="header">
            <div class="avatar">
                <img src="https://github.com/oliveirasantosguilherme5.png" alt="Avatar do Guilherme">
            </div>
            <h1 class="title">Guilherme</h1>
            <p class="subtitle">Meus sites favoritos</p>
            <a href="https://github.com/oliveirasantosguilherme5" target="_blank" class="github-link">
                <i class="fab fa-github"></i> oliveirasantosguilherme5
            </a>
        </header>

        <main class="grid">
            <!-- YouTube -->
            <a href="https://www.youtube.com/" target="_blank" class="card card-youtube">
                <div class="card-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="card-info">
                    <h2>YouTube</h2>
                    <p>Vídeos, música e muito mais</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- Mercado Livre -->
            <a href="https://www.mercadolivre.com.br/" target="_blank" class="card card-mercadolivre">
                <div class="card-icon">
                    <i class="fas fa-handshake"></i>
                </div>
                <div class="card-info">
                    <h2>Mercado Livre</h2>
                    <p>Compras e ofertas online</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- Disney+ -->
            <a href="https://www.disneyplus.com/pt-br" target="_blank" class="card card-disney">
                <div class="card-icon">
                    <i class="fas fa-wand-magic-sparkles"></i>
                </div>
                <div class="card-info">
                    <h2>Disney+</h2>
                    <p>Filmes, séries e originais</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- Twitch -->
            <a href="https://www.twitch.tv/" target="_blank" class="card card-twitch">
                <div class="card-icon">
                    <i class="fab fa-twitch"></i>
                </div>
                <div class="card-info">
                    <h2>Twitch</h2>
                    <p>Lives e streams ao vivo</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- ChatGPT -->
            <a href="https://chatgpt.com/" target="_blank" class="card card-chatgpt">
                <div class="card-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="card-info">
                    <h2>ChatGPT</h2>
                    <p>Inteligência artificial</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
        </main>

        <footer class="footer">
            <p>Feito com <i class="fas fa-heart"></i> por Guilherme</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
